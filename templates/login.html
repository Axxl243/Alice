{%extends 'Plantilla.html'%}
{%block title%}
    Login
{%endblock%}

{% block cabecera %}
    Iniciar sesion
{% endblock%}
    
{%block main%}
<div>

    <form action = "/login" method = "POST">
        <label for="logUser">Usuario</label>
        <input type="text" name="logUser" id="logUser" placeholder= "ingrese su Usuario" required>
    </form>

    
    <div class="form-group">
        <label for="logPass">Contraseña</label>
        <input type="text" class="form-control" name="logPass" id="logPass" aria-describedby="helpid" placeholder= "ingrese su Contraseña">
        <small id="logPass" class="form-text" text-muted>Mensaje de error</small>
    </div>

    <input class="btn btn-primary" type="submit" value="Iniciar sesion">

    <p>{{msj}}
     No tienes una cuenta?<a href="{{ url_for('registro') }}">Crea una cuenta</a>
    </p>
</div>
{%endblock%}
