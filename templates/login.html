{% extends 'Plantilla.html' %}

{% block titulo %}Login{% endblock %}

{% block cabecera %}Iniciar sesión{% endblock %}

{% block main %}
<div class="card-form">
    <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
            <label for="logUser" class="form-label">Correo</label>
            <input type="email" class="form-control" name="logUser" id="logUser" placeholder="ingrese su correo" required>
        </div>

        <div class="mb-3">
            <label for="logPass" class="form-label">Contraseña</label>
            <input type="password" class="form-control" name="logPass" id="logPass" placeholder="ingrese su contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    </form>

    <p class="mt-3">
        {{ msj }}
        ¿No tienes una cuenta? <a href="{{ url_for('registro') }}">Crea una cuenta</a>
    </p>
</div>
{% endblock %}
